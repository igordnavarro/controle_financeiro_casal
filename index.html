<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Finanças do Casal</title>
  <meta name="description" content="Controle financeiro do Igor e da Thais: despesas fixas, cartões, rendas e gráficos.">
  <meta name="theme-color" content="#1f6f5c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanças">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Tela de login -->
  <section id="tela-login" class="login" hidden>
    <div class="login-card">
      <div class="logo-grande" aria-hidden="true">
        <svg viewBox="0 0 48 48"><rect x="4" y="10" width="40" height="28" rx="6" fill="currentColor" opacity=".15"/><rect x="4" y="10" width="40" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M4 19h40" stroke="currentColor" stroke-width="3"/><circle cx="34" cy="29" r="3" fill="currentColor"/></svg>
      </div>
      <h1>Finanças do Casal</h1>
      <p>Igor &amp; Thais — tudo sincronizado entre computador, celular e tablet.</p>
      <button id="btn-entrar" class="btn btn-google">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Entrar com Google
      </button>
      <p id="erro-login" class="erro" hidden></p>
    </div>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <aside class="nav-lateral">
      <div class="marca">
        <svg viewBox="0 0 48 48" width="28" height="28" aria-hidden="true"><rect x="4" y="10" width="40" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M4 19h40" stroke="currentColor" stroke-width="3.5"/><circle cx="34" cy="29" r="3" fill="currentColor"/></svg>
        <span>Finanças do Casal</span>
      </div>
      <nav id="nav" class="nav" aria-label="Seções"></nav>
      <div class="usuario" id="usuario-lateral"></div>
    </aside>

    <main class="conteudo">
      <header class="topo">
        <div class="seletor-mes">
          <button class="btn-icone" data-acao="mes-anterior" aria-label="Mês anterior">‹</button>
          <label class="mes-atual">
            <span id="rotulo-mes"></span>
            <input type="month" id="input-mes" aria-label="Escolher mês">
          </label>
          <button class="btn-icone" data-acao="mes-proximo" aria-label="Próximo mês">›</button>
        </div>
        <div class="topo-direita">
          <span id="status-sync" class="status-sync" title="Sincronização"></span>
          <button class="btn-icone so-celular" data-acao="ir" data-aba="ajustes" aria-label="Ajustes">⚙︎</button>
        </div>
      </header>
      <div id="aviso-local" class="aviso" hidden>
        Modo local: os dados ficam só neste navegador. Configure o Firebase (veja o README) para ativar o login Google e a sincronização.
      </div>
      <section id="tela" class="tela" aria-live="polite"></section>
    </main>

    <nav id="nav-inferior" class="nav-inferior" aria-label="Seções"></nav>
    <button id="fab" class="fab" data-acao="novo" aria-label="Adicionar lançamento">+</button>
  </div>

  <dialog id="modal" class="modal"><form method="dialog" id="modal-form" class="modal-corpo" novalidate></form></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
